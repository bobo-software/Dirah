name: Secrets

on:
  pull_request:
  push:
    branches: [master, monorepo]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan new commits for credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base ref is available for the range below.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # Only the commits introduced by this push/PR. The pre-rotation values in
      # old history are DIRA-39/DIRA-40 and must not fail every build.
      - name: Scan new commits
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF:-}" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          else
            range="-1"
          fi
          echo "Scanning $range"
          gitleaks git --log-opts="$range" --config .gitleaks.toml --redact --verbose
