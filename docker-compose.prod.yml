# One Coolify Application (Docker Compose build pack): web + API on one
# network. Postgres and MinIO stay external (the existing Coolify-managed
# services), so their connection details come from the root .env.
#
# Coolify: create an Application with the Compose build strategy, point it at
# this file, paste the keys from .env.example into Environment Variables, then
# add the domains with the internal port suffix:
#   https://dirah.co.za:83       -> service web
#   https://api.dirah.co.za:4006 -> service backend
#
# Local check:
#   cp .env.example .env   # fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4006
      # Where the API fetches the built web app from when it renders a public
      # page for a crawler. The web container answers on port 83.
      WEB_INTERNAL_URL: http://web:83
    expose:
      - '4006'
    restart: unless-stopped
    # Readiness, not liveness: the container is unhealthy while Postgres or
    # object storage is unreachable, which is what Coolify should show.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4006/health/ready']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_PUBLIC_API_URL: ${VITE_PUBLIC_API_URL:?set VITE_PUBLIC_API_URL in .env}
        # The public address of the web app, for the canonical link and the
        # social preview image in the generated head.
        VITE_SITE_URL: ${APP_PUBLIC_URL:-}
    expose:
      - '83'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:83/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
