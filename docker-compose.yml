services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dira
      POSTGRES_PASSWORD: dira
      POSTGRES_DB: dira
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dira -d dira']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    # Optional. Point MINIO_ENDPOINT at http://localhost:9000 and keys at MINIO_ROOT_* below.
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
