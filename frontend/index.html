<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f2ef" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17161b" />
    <title>Dirah</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dira.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
