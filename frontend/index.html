<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f2ef" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17161b" />
    <!--
      The title, description, canonical link and social preview tags live here.
      The build fills this block in (plugins/seoHead.ts) and the API swaps it
      for the tags of the page being viewed (backend/src/services/SeoService.ts),
      so a link pasted into a chat shows the page it points at.
    -->
    <!--seo:head-->
    <!--/seo:head-->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dira.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
